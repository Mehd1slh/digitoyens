{% extends "base.html" %}
{% block page_title %}Médiathèque{% endblock %}
{% block page_sub %}— Photos & vidéos des événements{% endblock %}
{% block content %}
<style>
.media-grid { display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px; }
.media-card { background:var(--ink2);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;cursor:pointer;transition:all 0.25s; }
.media-card:hover { border-color:var(--border2);transform:translateY(-3px);box-shadow:0 14px 36px rgba(0,0,0,0.4); }
.mc-cover { height:160px;display:flex;align-items:center;justify-content:center;font-size:56px;position:relative; }
.mc-body { padding:16px; }
.mc-title { font-family:'Syne',sans-serif;font-weight:700;font-size:15px;margin-bottom:4px; }
.mc-date { font-size:12px;color:var(--text3);margin-bottom:12px; }
.mc-stats { display:flex;gap:14px;margin-bottom:14px; }
.mc-stat { display:flex;align-items:center;gap:5px;font-size:12.5px;color:var(--text2); }
.mc-drive { display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--ink3);border-radius:10px;text-decoration:none;color:var(--text);font-size:13px;font-weight:500;transition:all 0.2s; }
.mc-drive:hover { background:rgba(6,182,212,0.1);border-color:var(--accent2);color:var(--accent2); }
.mc-drive-icon { font-size:18px; }
</style>

<div class="media-grid" id="mediaGrid">
  <div style="grid-column:1/-1;text-align:center;color:var(--text3);padding:40px;">Chargement…</div>
</div>

<script>
const COVER_GRADIENTS = {
  'forum':'linear-gradient(135deg,#1e1b4b,#4c1d95)',
  'caravane':'linear-gradient(135deg,#431407,#7c2d12)',
  'seminar':'linear-gradient(135deg,#052e16,#064e3b)',
};
const COVER_EMOJI = {'forum':'🏛️','caravane':'🎭','seminar':'🧠'};

fetch('/api/media').then(r=>r.json()).then(data => {
  document.getElementById('mediaGrid').innerHTML = data.map(m => `
    <div class="media-card fade-up">
      <div class="mc-cover" style="background:${COVER_GRADIENTS[m.cover]||'var(--ink3)'}">
        ${COVER_EMOJI[m.cover]||'📸'}
      </div>
      <div class="mc-body">
        <div class="mc-title">${m.title}</div>
        <div class="mc-date">📅 ${new Date(m.date).toLocaleDateString('fr-FR',{year:'numeric',month:'long',day:'numeric'})}</div>
        <div class="mc-stats">
          <div class="mc-stat">📸 <span>${m.photos} photos</span></div>
          <div class="mc-stat">🎬 <span>${m.videos} vidéos</span></div>
        </div>
        <a href="${m.driveLink}" target="_blank" class="mc-drive">
          <span class="mc-drive-icon">📁</span>
          <span>Ouvrir sur Google Drive</span>
          <span style="margin-left:auto;font-size:11px;color:var(--text3);">→</span>
        </a>
      </div>
    </div>`).join('');
});
</script>
{% endblock %}
