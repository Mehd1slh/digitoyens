{% extends "base.html" %}
{% block page_title %}Apprentissage{% endblock %}
{% block page_sub %}— Ressources & enregistrements{% endblock %}

{% block content %}
<style>
.learning-tabs { display:flex;gap:4px;margin-bottom:24px;background:var(--ink2);border:1px solid var(--border);border-radius:12px;padding:5px;width:fit-content; }
.ltab { padding:8px 18px;border-radius:9px;font-size:13px;font-weight:600;cursor:pointer;transition:all 0.2s;color:var(--text2);border:none;background:none;font-family:'DM Sans',sans-serif; }
.ltab.active { background:var(--primary);color:white;box-shadow:0 4px 12px var(--primary-glow); }
.ltab:not(.active):hover { color:var(--text);background:var(--ink3); }

.resources-grid { display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px; }
.resource-card { background:var(--ink2);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;cursor:pointer;transition:all 0.25s; }
.resource-card:hover { border-color:var(--border2);transform:translateY(-3px);box-shadow:0 14px 36px rgba(0,0,0,0.4); }

.rc-thumbnail {
  height:140px;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;
}
.rc-play {
  width:50px;height:50px;background:rgba(255,255,255,0.15);border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-size:20px;
  backdrop-filter:blur(4px);border:2px solid rgba(255,255,255,0.3);
  transition:all 0.2s;
}
.resource-card:hover .rc-play { background:var(--primary);transform:scale(1.1); }
.rc-duration {
  position:absolute;bottom:10px;right:10px;
  background:rgba(0,0,0,0.7);color:white;font-size:11px;font-weight:600;
  padding:2px 8px;border-radius:6px;font-family:'JetBrains Mono',monospace;
}
.rc-type-badge { position:absolute;top:10px;left:10px; }
.rc-body { padding:16px; }
.rc-category { font-size:11px;color:var(--primary-light);font-weight:600;text-transform:uppercase;letter-spacing:0.06em;margin-bottom:6px; }
.rc-title { font-family:'Syne',sans-serif;font-weight:700;font-size:14.5px;margin-bottom:6px; }
.rc-desc { font-size:12.5px;color:var(--text2);line-height:1.5;margin-bottom:10px; }
.rc-footer { display:flex;align-items:center;justify-content:space-between;padding-top:10px;border-top:1px solid var(--border); }
.rc-views { font-size:11.5px;color:var(--text3); }
.rc-level { font-size:11px;padding:2px 8px;border-radius:20px; }

/* Player modal */
.player-modal { padding:0;max-width:680px;overflow:hidden; }
.video-placeholder { height:360px;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px; }
.vp-play-btn { width:72px;height:72px;border-radius:50%;background:var(--primary);display:flex;align-items:center;justify-content:center;font-size:28px;cursor:pointer;transition:all 0.2s;box-shadow:0 8px 24px var(--primary-glow); }
.vp-play-btn:hover { transform:scale(1.1); }
</style>

<div class="learning-tabs">
  <button class="ltab active" onclick="switchLtab('all',this)">Tout</button>
  <button class="ltab" onclick="switchLtab('video',this)">🎬 Vidéos</button>
  <button class="ltab" onclick="switchLtab('recording',this)">🔴 Enregistrements</button>
</div>

<div class="resources-grid" id="resourcesGrid"></div>

<!-- Player Modal -->
<div class="modal-overlay" id="playerModal" onclick="closePlayer()">
  <div class="modal player-modal" onclick="event.stopPropagation()" id="playerContent"></div>
</div>

<script>
const THUMB_GRADIENTS = {
  'advocacy':'linear-gradient(135deg,#1e1b4b,#4c1d95)',
  'facilitation':'linear-gradient(135deg,#052e16,#064e3b)',
  'community':'linear-gradient(135deg,#0c1445,#1e3a8a)',
  'meeting':'linear-gradient(135deg,#1c1917,#292524)',
  'project':'linear-gradient(135deg,#431407,#7c2d12)',
  'strategy':'linear-gradient(135deg,#0f172a,#1e3a5f)',
};
const THUMB_EMOJI = {'advocacy':'⚖️','facilitation':'🗣️','community':'👥','meeting':'📹','project':'📊','strategy':'🧭'};
const LEVEL_COLORS = {'Débutant':'badge-green','Intermédiaire':'badge-amber','Tous':'badge-cyan'};

let allRes = [], currentResTab = 'all';

function switchLtab(tab, el) {
  document.querySelectorAll('.ltab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  currentResTab = tab;
  renderResources();
}

function renderResources() {
  const data = currentResTab==='all' ? allRes : allRes.filter(r=>r.type===currentResTab);
  document.getElementById('resourcesGrid').innerHTML = data.map(r => `
    <div class="resource-card fade-up" onclick="openPlayer(${r.id})">
      <div class="rc-thumbnail" style="background:${THUMB_GRADIENTS[r.thumbnail]||'var(--ink3)'}">
        ${THUMB_EMOJI[r.thumbnail]||'🎬'}
        <div class="rc-play">▶</div>
        <div class="rc-duration">${r.duration}</div>
        <div class="rc-type-badge"><span class="badge ${r.type==='video'?'badge-purple':'badge-red'}">${r.type==='video'?'Vidéo':'🔴 REC'}</span></div>
      </div>
      <div class="rc-body">
        <div class="rc-category">${r.category}</div>
        <div class="rc-title">${r.title}</div>
        <div class="rc-desc">${r.description}</div>
        <div class="rc-footer">
          <span class="rc-views">👁 ${r.views} vues</span>
          <span class="badge ${LEVEL_COLORS[r.level]||'badge-cyan'} rc-level">${r.level}</span>
        </div>
      </div>
    </div>`).join('');
}

function openPlayer(id) {
  const r = allRes.find(x=>x.id===id);
  if(!r) return;
  document.getElementById('playerContent').innerHTML = `
    <div class="video-placeholder" style="background:${THUMB_GRADIENTS[r.thumbnail]||'var(--ink3)'}">
      <div style="font-size:80px;opacity:0.2;">${THUMB_EMOJI[r.thumbnail]||'🎬'}</div>
      <div class="vp-play-btn">▶</div>
      <div style="font-size:12px;color:rgba(255,255,255,0.5);">Cliquez pour lancer · ${r.duration}</div>
    </div>
    <div style="padding:22px;">
      <div style="display:flex;gap:8px;margin-bottom:10px;">
        <span class="badge ${r.type==='video'?'badge-purple':'badge-red'}">${r.type==='video'?'Vidéo':'Enregistrement'}</span>
        <span class="badge badge-cyan">${r.category}</span>
        <span class="badge ${LEVEL_COLORS[r.level]||'badge-cyan'}">${r.level}</span>
      </div>
      <div style="font-family:'Syne',sans-serif;font-weight:800;font-size:20px;margin-bottom:8px;">${r.title}</div>
      <div style="font-size:13.5px;color:var(--text2);line-height:1.6;margin-bottom:18px;">${r.description}</div>
      <div style="display:flex;gap:8px;">
        <button class="btn btn-ghost" style="flex:1;" onclick="closePlayer()">Fermer</button>
      </div>
    </div>`;
  document.getElementById('playerModal').classList.add('open');
}
function closePlayer() { document.getElementById('playerModal').classList.remove('open'); }

fetch('/api/resources').then(r=>r.json()).then(data => { allRes=data; renderResources(); });
</script>
{% endblock %}
