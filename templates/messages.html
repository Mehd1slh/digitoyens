{% extends "base.html" %}
{% block page_title %}Messages{% endblock %}
{% block page_sub %}— Messagerie interne{% endblock %}
{% block content %}
<style>
.messages-layout { display:grid;grid-template-columns:300px 1fr;height:calc(100vh - 120px);gap:0;background:var(--ink2);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden; }
.msg-list { border-right:1px solid var(--border);display:flex;flex-direction:column; }
.msg-list-header { padding:16px;border-bottom:1px solid var(--border); }
.msg-list-search { display:flex;align-items:center;gap:8px;background:var(--ink3);border:1px solid var(--border);border-radius:10px;padding:8px 12px; }
.msg-list-search input { background:none;border:none;outline:none;color:var(--text);font-size:13px;font-family:'DM Sans',sans-serif;width:100%; }
.msg-list-items { flex:1;overflow-y:auto; }
.msg-item { display:flex;gap:12px;padding:14px 16px;cursor:pointer;transition:background 0.15s;border-bottom:1px solid var(--border); }
.msg-item:hover { background:var(--ink3); }
.msg-item.active { background:rgba(124,58,237,0.1); }
.msg-item-name { font-size:13.5px;font-weight:600;margin-bottom:3px; }
.msg-item-prev { font-size:12px;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:160px; }
.msg-item-time { font-size:10.5px;color:var(--text3); }
.unread-badge { width:8px;height:8px;background:var(--primary);border-radius:50%;flex-shrink:0;margin-top:4px; }

.chat-area { display:flex;flex-direction:column; }
.chat-header { padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px; }
.chat-status { width:8px;height:8px;background:var(--green);border-radius:50; }
.chat-messages { flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:12px; }
.msg-bubble { max-width:65%;padding:12px 16px;border-radius:14px;font-size:13.5px;line-height:1.5; }
.msg-bubble.them { background:var(--ink3);border:1px solid var(--border);align-self:flex-start;border-bottom-left-radius:4px; }
.msg-bubble.me { background:var(--primary);color:white;align-self:flex-end;border-bottom-right-radius:4px; }
.bubble-time { font-size:10px;margin-top:4px;opacity:0.6; }
.chat-input-area { padding:16px 20px;border-top:1px solid var(--border);display:flex;gap:10px; }
.chat-input-box { flex:1;display:flex;align-items:center;gap:8px;background:var(--ink3);border:1px solid var(--border);border-radius:12px;padding:10px 16px;transition:all 0.2s; }
.chat-input-box:focus-within { border-color:var(--primary); }
.chat-input-box input { background:none;border:none;outline:none;color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;flex:1; }
.send-btn { width:40px;height:40px;background:var(--primary);border:none;border-radius:10px;cursor:pointer;font-size:16px;transition:all 0.2s;flex-shrink:0; }
.send-btn:hover { background:var(--primary-light);transform:scale(1.05); }

.no-chat { flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;color:var(--text3); }
</style>

<div class="messages-layout">
  <!-- Conversation list -->
  <div class="msg-list">
    <div class="msg-list-header">
      <div style="font-family:'Syne',sans-serif;font-weight:700;font-size:15px;margin-bottom:10px;">Conversations</div>
      <div class="msg-list-search"><span>🔍</span><input type="text" placeholder="Rechercher…"></div>
    </div>
    <div class="msg-list-items" id="msgListItems"></div>
    <!-- New conversation button -->
    <div style="padding:12px;border-top:1px solid var(--border);">
      <button class="btn btn-primary w-full" style="justify-content:center;" onclick="document.getElementById('newMsgModal').classList.add('open')">＋ Nouvelle conversation</button>
    </div>
  </div>

  <!-- Chat area -->
  <div class="chat-area" id="chatArea">
    <div class="no-chat">
      <div style="font-size:48px;">💬</div>
      <div style="font-size:15px;font-weight:600;">Sélectionnez une conversation</div>
      <div style="font-size:13px;">ou commencez une nouvelle discussion</div>
    </div>
  </div>
</div>

<!-- New message modal -->
<div class="modal-overlay" id="newMsgModal" onclick="document.getElementById('newMsgModal').classList.remove('open')">
  <div class="modal" onclick="event.stopPropagation()" style="max-width:460px;">
    <div style="font-family:'Syne',sans-serif;font-weight:700;font-size:18px;margin-bottom:16px;">Nouvelle conversation</div>
    <div class="input-group"><label>Destinataire</label><input class="input" type="text" placeholder="Chercher un ambassadeur…"></div>
    <div class="input-group"><label>Message</label><textarea class="input" rows="3" placeholder="Votre message…"></textarea></div>
    <div style="display:flex;gap:10px;margin-top:8px;">
      <button class="btn btn-primary" style="flex:1;" onclick="document.getElementById('newMsgModal').classList.remove('open')">Envoyer</button>
      <button class="btn btn-ghost" onclick="document.getElementById('newMsgModal').classList.remove('open')">Annuler</button>
    </div>
  </div>
</div>

<script>
const DUMMY_CHATS = {
  1: [
    {from:'them',text:'Salut Karim! Tu as vu le programme du hackathon?',time:'14:23'},
    {from:'me',text:"Oui! Super excité pour les 3 jours. Tu arrives quand à Marrakech?",time:'14:25'},
    {from:'them',text:'Je pense arriver mercredi à 15h. On peut se retrouver pour le Ftour?',time:'14:28'},
    {from:'me',text:'Parfait! À l\'Hacienda directement.',time:'14:30'},
  ],
  2: [
    {from:'them',text:'On se retrouve avant le Ftour? J\'ai des nouvelles sur le projet Souss.',time:'Hier 18:00'},
    {from:'me',text:"Bien sûr! Vers quelle heure?",time:'Hier 18:05'},
    {from:'them',text:'18h30? Juste avant l\'ouverture du hackathon.',time:'Hier 18:06'},
  ],
  3: [
    {from:'them',text:"J'ai partagé les ressources sur le drive. Check le dossier 'Formation 2026'",time:'Il y a 3j'},
    {from:'me',text:'Merci! Je vais regarder ça ce soir.',time:'Il y a 3j'},
  ]
};

let activeConvId = null;

fetch('/api/messages').then(r=>r.json()).then(msgs => {
  document.getElementById('msgListItems').innerHTML = msgs.map(m => `
    <div class="msg-item ${m.unread?'':''}${m.id===activeConvId?' active':''}" onclick="openChat(${m.id},'${m.from}','${m.avatar}','${m.color}','${m.photo_url||''}')">
      ${avatarHTML(m.photo_url, m.avatar, m.color, 'av-md')}
      <div style="flex:1;min-width:0;">
        <div class="msg-item-name">${m.from}</div>
        <div class="msg-item-prev">${m.preview}</div>
      </div>
      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px;">
        <div class="msg-item-time">${m.time}</div>
        ${m.unread?'<div class="unread-badge"></div>':''}
      </div>
    </div>`).join('');
});

function openChat(id, name, avatar, color, photoUrl) {
  activeConvId = id;
  // Update active state
  document.querySelectorAll('.msg-item').forEach(m=>m.classList.remove('active'));
  event.currentTarget.classList.add('active');

  const messages = DUMMY_CHATS[id] || [];
  document.getElementById('chatArea').innerHTML = `
    <div class="chat-header">
      ${avatarHTML(photoUrl, avatar, color, 'av-md')}
      <div>
        <div style="font-family:'Syne',sans-serif;font-weight:700;font-size:15px;">${name}</div>
        <div style="font-size:11.5px;color:var(--green);display:flex;align-items:center;gap:5px;"><span style="width:6px;height:6px;background:var(--green);border-radius:50%;display:inline-block;"></span>En ligne</div>
      </div>
    </div>
    <div class="chat-messages" id="chatMessages">
      ${messages.map(m=>`
        <div class="msg-bubble ${m.from}">
          ${m.text}
          <div class="bubble-time">${m.time}</div>
        </div>
      `).join('')}
    </div>
    <div class="chat-input-area">
      <div class="chat-input-box">
        <span style="font-size:18px;cursor:pointer;">😊</span>
        <input type="text" placeholder="Écrire un message…" id="chatInputField" onkeydown="if(event.key==='Enter')sendMsg()">
        <span style="font-size:18px;cursor:pointer;">📎</span>
      </div>
      <button class="send-btn" onclick="sendMsg()">➤</button>
    </div>`;
  
  const cm = document.getElementById('chatMessages');
  if(cm) cm.scrollTop = cm.scrollHeight;
}

function sendMsg() {
  const input = document.getElementById('chatInputField');
  if(!input || !input.value.trim()) return;
  const msgs = document.getElementById('chatMessages');
  const div = document.createElement('div');
  div.innerHTML = `<div class="msg-bubble me">${input.value}<div class="bubble-time">Maintenant</div></div>`;
  msgs.appendChild(div);
  input.value = '';
  msgs.scrollTop = msgs.scrollHeight;
  
  // Simulate reply
  setTimeout(() => {
    const replyDiv = document.createElement('div');
    replyDiv.innerHTML = `<div class="msg-bubble them">👍 Reçu, merci!<div class="bubble-time">Maintenant</div></div>`;
    msgs.appendChild(replyDiv);
    msgs.scrollTop = msgs.scrollHeight;
  }, 1200);
}
</script>
{% endblock %}
